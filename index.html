<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="app — GitHub, Vercel and Supabase connected" />
  <title>app</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f17;
      --card: #131a26;
      --border: #223047;
      --text: #e6edf7;
      --muted: #8b9bb4;
      --accent: #3ecf8e;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 600px at 50% -10%, #16233a 0%, var(--bg) 60%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    main { width: 100%; max-width: 640px; }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      margin: 0 0 8px;
      letter-spacing: -0.03em;
    }
    .sub { color: var(--muted); margin: 0 0 28px; }
    .grid { display: grid; gap: 12px; margin-bottom: 24px; }
    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      font-weight: 600;
    }
    .card small { color: var(--muted); font-weight: 400; font-size: 0.8rem; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--muted); flex: 0 0 auto;
      box-shadow: 0 0 0 4px rgba(139, 155, 180, 0.12);
    }
    .dot.ok { background: var(--accent); box-shadow: 0 0 0 4px rgba(62, 207, 142, 0.15); }
    .dot.bad { background: var(--danger); box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.15); }
    .left { display: flex; align-items: center; gap: 12px; }
    button {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #1b2638;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #223149; }
    pre {
      margin: 16px 0 0;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0e141f;
      color: var(--muted);
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <main>
    <h1>app</h1>
    <p class="sub">GitHub · Vercel · Supabase — connected</p>

    <div class="grid">
      <div class="card">
        <span class="left"><span class="dot ok"></span> GitHub</span>
        <small>ta12gang23-do/app</small>
      </div>
      <div class="card">
        <span class="left"><span class="dot ok"></span> Vercel</span>
        <small>app</small>
      </div>
      <div class="card">
        <span class="left"><span class="dot" id="sb-dot"></span> Supabase</span>
        <small id="sb-status">checking…</small>
      </div>
    </div>

    <button id="test" type="button">Test Supabase connection</button>
    <pre id="out">Ready.</pre>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
